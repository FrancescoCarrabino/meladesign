<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuela Papa - Portfolio</title>
<meta name="description" content="Portfolio of Manuela Papa, communication and industrial designer based in Venice, Italy.">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<div class="stage" id="stage">

  <div class="book" id="book">
    <img id="spread" alt="" draggable="false">

    <!-- stop-motion clip that replaces the spread while a pocket is open -->
    <video id="pocketVideo" class="pocket-video" playsinline muted preload="none"></video>

    <!-- percentage-positioned click and hover targets, rebuilt per spread -->
    <div id="hotspots" class="hotspots"></div>

    <!-- inline film that sits on top of a spread, opened by its apple -->
    <div id="inlineFilm" class="inline-film" hidden>
      <video id="inlineVideo" playsinline muted loop preload="none"></video>
      <button id="inlineFilmClose" class="film-close" type="button" aria-label="Close the video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M7 7l10 10M17 7L7 17"/>
        </svg>
      </button>
    </div>

    <!-- enlarged photo shown while hovering a contact-sheet thumbnail -->
    <figure id="zoom" class="zoom" hidden>
      <img id="zoomImage" alt="">
      <figcaption id="zoomCaption"></figcaption>
    </figure>

  </div>

  <!-- the whole left and right halves of the window turn pages, book or not -->
  <div class="page-turn prev" id="prevArea" title="Previous page"></div>
  <div class="page-turn next" id="nextArea" title="Next page"></div>

  <div id="intro" class="intro">
    <p class="intro-hello">Hi, I'm Mela</p>
    <p class="intro-sub">This is my <u>portfolio</u>,<br>start flipping through!</p>
  </div>

  <div id="outro" class="outro">
    <p class="outro-hello">Thanks for<br>your attention</p>
    <div class="outro-contact">
      <p>Contact:</p>
      <p><a href="mailto:p.manuela99@gmail.com">p.manuela99@gmail.com</a></p>
      <p><a href="https://www.instagram.com/_melanapapu/" target="_blank" rel="noopener noreferrer">@_melanapapu</a></p>
      <p>+39 3895399534</p>
    </div>
  </div>

  <footer class="bar">
    <button id="summaryBtn" class="bar-btn" type="button">
      <span class="bar-icon" aria-hidden="true">&#9776;</span><span>Summary</span>
    </button>
    <button id="restartBtn" class="bar-btn" type="button">
      <span>Restart</span>
      <svg class="bar-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
      </svg>
    </button>
  </footer>

  <!-- full-screen reader for the printed books -->
  <div id="reader" class="reader" hidden>
    <button id="readerClose" class="reader-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M8 8l8 8M16 8l-8 8"/>
      </svg>
    </button>
    <img id="readerPage" alt="">
    <div class="reader-turn prev" id="readerPrev"></div>
    <div class="reader-turn next" id="readerNext"></div>
    <p class="reader-count" id="readerCount"></p>
  </div>

  <p class="rotate-hint">Turn your phone sideways to read the book.</p>

</div>

<script src="app.js?v=10"></script>
</body>
</html>
